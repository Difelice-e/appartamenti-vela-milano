# ==============================================================================
# BRAND INPUT — Appartamenti Vela Milano Centro con Garage
# ==============================================================================
# Compilato da: report consulenza + scraping Booking.com + foto fornite
# Data compilazione: 2026-04-18
# ==============================================================================

# --- Informazioni Base ---
name: "Appartamenti Vela Milano"
slug: "appartamenti-vela-milano"
type: "appartamenti"              # Short-stay apartments / aparthotel su Booking
tier: "plus"                      # Richiesto effetto liquid glass + target premium
                                  # (business, fiere, co-working) => serve Next.js

# --- Localizzazione ---
locale:
  language: "it"
  secondary_languages: []         # DEMO solo IT. In delivery valuteremo con il
                                  # cliente l'aggiunta di EN (e altre lingue).
  city: "Milano"
  province: "MI"
  region: "Lombardia"
  country: "IT"
  neighborhood: "Città Studi / Loreto / Piola"
  zone_character: "green pocket nel centro di Milano, ben collegato con i mezzi"

# --- Identità Visiva ---
logo_path: ""                     # Da generare in fase di demo (vedi logo_strategy)
logo_strategy:
  type: "wordmark"                # Solo testuale (no simbolo) per la demo
  content: "Appartamenti Vela Milano"
  style_direction: >
    Wordmark elegante e minimale, font display coerente col brand (serif
    moderno o grotesk raffinato), palette: lettering in verde primario
    (#3A7D44) o verde scuro (#1F2A24) su sfondo chiaro. Possibile sottile
    accento cromatico (accent o verde) su una lettera-chiave o sulla parola
    "Vela" per dare riconoscibilità.
  notes: >
    In delivery valuteremo se evolvere in un logo completo con simbolo
    (vela/foglia/onda) dopo validazione del wordmark con il cliente.
colors:
  # Direzione confermata dal cliente per la demo.
  # In fase di ricerca/delivery valuteremo un accent "legno chiaro / parquet"
  # al posto del giallo per richiamare direttamente la materia dominante degli interni.
  primary: "#3A7D44"              # Verde natura (foglia / pianta)
  secondary: "#F6F4EC"            # Bianco caldo (luminosità, parquet chiaro)
  accent: "#E8C547"               # Giallo acceso (sole/vetrate) — DEMO
  neutral_dark: "#1F2A24"         # Verde scurissimo per testi
  neutral_light: "#FFFFFF"        # Bianco puro per sfondi liquid-glass
  accent_alternatives_to_research:
    # Tonalità "legno chiaro / parquet" da esplorare in fase di ricerca come
    # possibile sostituzione del giallo, per legare l'accent al parquet chiaro.
    - name: "light oak"
      hex: "#D9B382"
    - name: "pale wood"
      hex: "#C9A87C"
    - name: "cream wood"
      hex: "#E6CFA7"
    - name: "warm oak"
      hex: "#B8936A"
    # Alternative cromatiche già considerate (meno prioritarie)
    - name: "coral"
      hex: "#E86A4E"
    - name: "lime"
      hex: "#B7D84B"
  palette_notes: |
    Il cliente ha chiesto: verde natura come base, bianco come respiro,
    caratteri/headline in un colore acceso per contrastare luminosità degli spazi.
    Direzione confermata per la demo. In fase di RICERCA/DELIVERY valuteremo
    la sostituzione dell'accent giallo con una tonalità legno chiaro / parquet
    (vedi accent_alternatives_to_research) per agganciare l'accent al materiale
    dominante negli interni. Importante: con liquid glass serve contrasto
    adeguato su sfondi chiari — verificare leggibilità.
fonts:
  display: ""                     # Da definire — suggerito serif elegante + sans moderno
  body: ""                        # Lasciato vuoto per generazione automatica

# --- Filosofia del Brand ---
philosophy:
  mission: >
    Offrire agli ospiti un'esperienza di soggiorno all'insegna di relax, natura e
    ospitalità genuina nel centro di Milano, tramite appartamenti luminosi, curati
    nei dettagli bio e dotati di ogni comfort per turismo slow e business.
  vision: >
    Diventare il punto di riferimento a Milano per chi cerca un "green pocket" in
    città: un rifugio silenzioso e luminoso a due passi dalla frenesia milanese,
    ideale per viaggi d'affari, fiere, co-working e soggiorni di piacere.
  values:
    - "ospitalità personale"      # host presente, attesa fino a mezzanotte per check-in
    - "sostenibilità"             # prodotti bio, tema green
    - "natura in città"           # piante, verde, aria pulita
    - "comfort premium"           # cucine complete, parquet, aree esterne ampie
    - "sicurezza"                 # garage privato prenotabile
    - "multiculturalità"          # host parla più lingue
    - "luminosità"                # grandi vetrate, spazi aperti
  tone: "accogliente, elegante, naturale, rassicurante — voce calda ma professionale"

# --- Struttura / Inventario unità ---
units:
  total: 3
  typology: "bilocale matrimoniale"
  configuration: "tutti gli appartamenti sono molto simili tra loro"
  each_unit_includes:
    - "camera matrimoniale"
    - "bagno privato"
    - "cucina attrezzata"
    - "salone"
    - "balcone / area esterna"
  extra_beds:
    available: true
    options: ["letti aggiuntivi", "culle per bambini"]
  display_strategy: >
    Mostrare il numero (3 appartamenti) e la possibilità di letti/culle extra,
    ma NON creare card/sezioni separate per ogni unità — sono simili tra loro
    e meritano un racconto unico e coerente.

# --- Contenuti ---
content:
  tagline: "Un'oasi verde nel cuore di Milano"
  tagline_alternatives:
    - "Respira Milano, senza rinunciare al silenzio"
    - "La tua pausa green nel centro città"
    - "Natura, luce e comfort — a due passi dal Duomo"
  description: >
    Appartamenti Vela Milano è un rifugio luminoso e immerso nel verde nel centro
    di Milano. Tre appartamenti bilocali matrimoniali, con balconi spaziosi, cucina,
    salone e bagno privato, accolgono coppie, famiglie (con letti extra e culle),
    professionisti in trasferta e visitatori in fiera. Ogni appartamento è dotato
    di cucina attrezzata a induzione, prodotti da bagno 100% bio, accappatoi e
    finiture in parquet chiaro. Host multilingue, garage privato prenotabile e
    ottimi collegamenti con i mezzi pubblici completano l'esperienza.
  services:
    - "3 appartamenti bilocali matrimoniali, luminosi e con balconi"
    - "Possibilità di aggiungere letti extra e culle per bambini"
    - "Ogni appartamento ha bagno privato, cucina e salone"
    - "Cucine attrezzate con piano a induzione, forno e macchina del caffè"
    - "Prodotti da bagno 100% bio (shampoo, balsamo, bagnoschiuma)"
    - "Accappatoi in dotazione in ogni appartamento"
    - "Garage privato prenotabile a parte"
    - "Check-in flessibile fino a mezzanotte"
    - "Host multilingue"
    - "Spazi ideali per co-working e soggiorni business"
    - "WiFi gratuito"
    - "Parquet chiaro e arredi curati nei dettagli"
  target_audience:
    primary:
      - "turismo leisure di coppia (relax in città)"
      - "professionisti in trasferta / fiere (Rho Fiera, MiCo)"
      - "digital nomad / co-working"
    secondary:
      - "famiglie"
      - "gruppi di amici"

