# --- Richieste Aggiuntive ---
extra_requests: |
  TEMA E STILE
  - Tema sito CHIARO (light mode primario).
  - Effetto LIQUID GLASS (frosted/blurred translucent surfaces) sugli elementi
    principali: hero, card appartamenti, navbar, CTA.
  - Estetica luminosa e ariosa — molti whitespace, tipografia grande.
  - Palette green-nature con bianco dominante e accento acceso.

  FUNZIONALITÀ RICHIESTE
  - Form di raccolta email per preventivi / richieste di prenotazione
    (lead-gen verso la proprietaria, NON integrazione diretta con Booking).
  - Sezione dedicata al GARAGE prenotabile a parte — è un fattore distintivo.
  - Sezione "Green & Bio" che racconti i prodotti bio e la filosofia natura.
  - Galleria foto con focus su: balconi, vetrate, luminosità, parquet chiaro,
    cucine attrezzate, prodotti bio.
  - Sezione Business / Co-working / Fiere con CTA dedicata.
  - DEMO solo IT. Architettura dei testi deve però restare multilingua-ready
    (es: i18n-friendly) perché in delivery valuteremo l'aggiunta di EN (e
    potenzialmente FR/DE/ES) insieme al cliente.

  ELEMENTI DA EVIDENZIARE
  - Ospitalità personale della proprietaria (attesa fino a mezzanotte).
  - Posizione "green pocket" nel centro di Milano.
  - Cucine complete (induzione, forno, macchina caffè).
  - Parquet chiaro come elemento visivo.
  - Sicurezza del garage privato.
  - Collegamenti con i mezzi pubblici.

  ASSET DA PRODURRE / RECUPERARE
  - Foto aeree / drone NON disponibili. Per la DEMO si lavora esclusivamente
    con le 2 foto esterne già in brand_asset/ (esterno_1.jpg, esterno_2.jpg).
    Per il DELIVERY l'opportunità di uno shooting drone sarà valutata insieme
    al cliente.
  - Logo: da generare in fase di demo come WORDMARK testuale
    (vedi `logo_strategy` più sopra nel file).
  - Testi: per la DEMO generiamo copy CREATIVO con storytelling ricco e
    personalità (massimo impatto commerciale). In DELIVERY la proprietaria
    valida/modifica e si fanno eventuali revisioni.

  COPY STRATEGY (demo)
  - Tono: caldo, evocativo, sensoriale ("respira", "luce", "silenzio", "cura").
  - Storytelling sull'host: ospitalità personale, accoglienza multilingue,
    flessibilità check-in tardivo come gesto di cura.
  - Storytelling sugli spazi: "green pocket", parquet chiaro, balconi che
    si aprono sul verde, cucine per sentirsi a casa, prodotti bio come
    estensione della filosofia natura.
  - Micro-copy su CTA evocativo ("Pianifica la tua pausa verde", "Chiedi
    disponibilità", "Prenota il tuo angolo di silenzio").

